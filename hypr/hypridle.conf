# ~/.config/hypr/hypridle.conf
# Тема: Monochrome Vivid — управление простоем/сном/блокировкой.
#
# Все интервалы — в переменных ниже, в секундах. Меняй только цифры,
# остальное трогать не нужно.

# ---- Интервалы (секунды) ----
$dim_timeout     = 150   # 2.5 мин  — приглушить подсветку экрана
$lock_timeout    = 300   # 5 мин    — заблокировать экран (запускает hyprlock)
$dpms_timeout    = 330   # 5.5 мин  — выключить сигнал монитора (DPMS off), чуть позже блокировки
$suspend_timeout = 1200  # 20 мин   — уйти в сон (systemctl suspend)

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 1. Приглушаем подсветку заранее, как мягкое предупреждение "скоро блокировка"
listener {
    timeout = $dim_timeout
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 2. Блокируем экран
listener {
    timeout = $lock_timeout
    on-timeout = loginctl lock-session
}

# 3. Гасим монитор (DPMS off) вскоре после блокировки, чтобы не жечь панель впустую
listener {
    timeout = $dpms_timeout
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Уходим в сон, если совсем никто не отреагировал
listener {
    timeout = $suspend_timeout
    on-timeout = systemctl suspend
}
