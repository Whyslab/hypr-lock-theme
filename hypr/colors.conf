# ~/.config/hypr/colors.conf
#
# Единая палитра темы "Monochrome Vivid".
# Чтобы перекрасить весь экран блокировки — меняй значения только тут,
# hyprlock.conf их не хранит напрямую, только ссылается через $переменные.
#
# Философия палитры: НИ ОДНОГО цвета/оттенка. Состояния (обычное поле,
# caps lock, ошибка) различаются ЯРКОСТЬЮ/прозрачностью белого, а не цветом —
# отсюда "vivid": не яркие цвета, а яркий, контрастный чёрно-белый.

$font = JetBrainsMono Nerd Font

# ---- Базовые тона ----
$c_black        = rgba(10, 10, 10, 1.0)
$c_panel        = rgba(18, 18, 20, 0.55)
$c_panel_border = rgba(255, 255, 255, 0.12)

# ---- Текст ----
$c_white       = rgba(240, 240, 242, 1.0)
$c_grey_light  = rgba(205, 205, 208, 0.88)
$c_grey_mid    = rgba(165, 165, 169, 0.80)

# ---- Поле пароля: три уровня яркости вместо трёх цветов ----
$c_idle_ring  = rgba(255, 255, 255, 0.20)
$c_caps_ring  = rgba(255, 255, 255, 0.55)
$c_num_ring   = rgba(255, 255, 255, 0.32)
$c_both_ring  = rgba(255, 255, 255, 0.85)
$c_check_ring = rgba(255, 255, 255, 0.75)
$c_fail_ring  = rgba(255, 255, 255, 1.0)
